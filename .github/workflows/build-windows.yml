name: Build Windows App

on:
  push:
    branches:
      - main
      - master
      - feat/tauri-desktop
      - 'feat/**'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: boss-tauri/src-tauri

      - name: Install dependencies
        working-directory: boss-tauri
        run: npm ci

      - name: Build Tauri Windows App
        working-directory: boss-tauri
        run: npm run tauri:build

      - name: Upload Windows Executable (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: BossJob-Helper-Windows-Setup
          path: |
            boss-tauri/src-tauri/target/release/bundle/nsis/*.exe
            boss-tauri/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
